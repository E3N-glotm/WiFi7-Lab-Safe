name: Publish v1.5.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.5.1.yml"
      - "module.prop"
      - "common.sh"
      - "service.sh"
      - "post-fs-data.sh"
      - "action.sh"
      - "profile.sh"
      - "uninstall.sh"
      - "wifi7_lab_safe.conf"
      - "wcnss/**"
      - "tests/test_country_status.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate module version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version=v1.5.1$' module.prop
          grep -q '^versionCode=151$' module.prop
          sh -n common.sh
          sh -n service.sh
          sh -n post-fs-data.sh
          sh -n action.sh
          sh -n profile.sh
          sh -n uninstall.sh
          sh tests/test_country_status.sh

      - name: Build Magisk module ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="WiFi7-Lab-Safe-v1.5.1.zip"
          rm -f "$ZIP"
          zip -9 "$ZIP"             module.prop             wifi7_lab_safe.conf             common.sh             service.sh             post-fs-data.sh             action.sh             profile.sh             uninstall.sh             README.md             wcnss/WCNSS_qcom_cfg.ini.example
          sha256sum "$ZIP" | tee SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## WiFi7-Lab v1.5.1

          Bug-fix release on top of the v1.5.0 full-capability layer. Every item below was
          reproduced on the validation device (Xiaomi pudding / qca_cld3_peach_v2) before fixing.

          ### Fixed
          - TX power control was silently skipped: this device reports "Wiphy phy0" from
            `iw phy`, not "phy#0", so the PHY index was never detected and fixed/auto power
            never reached the driver. Both spellings are now handled, and a nl80211 refusal
            (I/O error -5 on this self-managed PHY) is logged with the readback instead of
            being reported as success.
          - Switching TX_POWER_MODE back to auto now actually issues `iw phy <phy> set txpower
            auto` (it previously returned success without calling the driver).
          - WCNSS overrides were appended AFTER the vendor ini's END marker, which the qcacld
            parser ignores. User keys are now inserted immediately BEFORE END, so injected
            keys (6 GHz switch, MLO links, TWT, NAN, TDLS, ...) actually reach the driver.
          - regdb target detection missed the board-specific Qualcomm layout used here
            (/vendor/firmware_mnt/image/<board>/regdb.bin); the bind-mount now finds it.
          - Channel summary counted "* NNNN MHz" lines and matched nothing on the real
            decimal-MHz dump ("* 2412.0 MHz"); counts are now correct.
          - ENABLE_DIAGNOSTICS=0 now really skips the diagnostics export.
          - REQUEST_DISABLE_DFS_AFC=1 is no longer inert: it deploys the vendor-verified DFS
            keys (gEnableDFSMasterCap=0, discardDFSchannelforMode=0,
            gSkipDfsChannelInP2pSearch=0, gAllowDFSChannelRoam=1) into the injected WCNSS ini.
            The driver keeps final discretion; verify the exported channel table.

          ### Added
          - Diagnostics export now includes a live per-band regulatory power ceiling table
            (from `iw reg get`) with DFS / NO-IR / NO-OUTDOOR / PASSIVE flags, so 00 vs US vs
            CN power and restriction differences are readable in one place.

          ### Unchanged
          - Regulatory domain (any ISO country / 00 / SYSTEM), TX auto/fixed with live readback,
            WCNSS override, regdb bind-mount, FORCE_WIFI_TOGGLE, profile.sh subcommands, and
            full uninstall rollback all behave as in v1.5.0.

          ### Validation
          Validated on Xiaomi pudding / Android 16 / Qualcomm qca_cld3_peach_v2.

          ### Scope
          For learning, research, interoperability, and controlled-laboratory reference only.
          The module gives full control of the parameters listed above; users are responsible for staying within local DFS/AFC/channel/power regulations.

          The attached ZIP is the Magisk-installable v1.5.1 package. SHA-256 is included in SHA256SUMS.txt.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.5.1 >/dev/null 2>&1; then
            echo "Release v1.5.1 already exists; keeping published artifact unchanged."
            exit 0
          fi
          gh release create v1.5.1             WiFi7-Lab-Safe-v1.5.1.zip             SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "WiFi7-Lab v1.5.1"             --notes-file RELEASE_NOTES.md
