name: Publish v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.5.0.yml"
      - "module.prop"
      - "common.sh"
      - "service.sh"
      - "post-fs-data.sh"
      - "action.sh"
      - "profile.sh"
      - "uninstall.sh"
      - "wifi7_lab_safe.conf"
      - "wcnss/**"
      - "tests/test_country_status.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate module version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version=v1.5.0$' module.prop
          grep -q '^versionCode=150$' module.prop
          sh -n common.sh
          sh -n service.sh
          sh -n post-fs-data.sh
          sh -n action.sh
          sh -n profile.sh
          sh -n uninstall.sh
          sh tests/test_country_status.sh

      - name: Build Magisk module ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="WiFi7-Lab-Safe-v1.5.0.zip"
          rm -f "$ZIP"
          zip -9 "$ZIP"             module.prop             wifi7_lab_safe.conf             common.sh             service.sh             post-fs-data.sh             action.sh             profile.sh             uninstall.sh             README.md             wcnss/WCNSS_qcom_cfg.ini.example
          sha256sum "$ZIP" | tee SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## WiFi7-Lab v1.5.0

          ### Changes
          - Full-capability lab module: every control is now a real, reversible action instead of a logged-only request.
          - Regulatory domain: any ISO country (US/CA/CN/JP/...), 00 (world), or SYSTEM; driver and framework readback are always verified.
          - TX power: auto (regulatory domain) or fixed nl80211 power in millibel, with live readback reported in Magisk description and diagnostics.
          - WCNSS override: stage any .ini into wcnss/, merged on top of the vendor config into /data/vendor/wifi/ (the path qcacld reads first). Single-key overrides without rebuilding the vendor file.
          - regdb replacement: bind-mount a custom regdb.bin over the detected vendor path (the direct way to change the regulatory channel/power table). Vendor partition is never modified.
          - FORCE_WIFI_TOGGLE: reload the WLAN driver with a Wi-Fi off/on toggle (no reboot, no cellular/ethernet impact).
          - post-fs-data deploys WCNSS/regdb before the driver starts, so the first boot after install already uses them.
          - profile.sh: tx / wcnss / regdb / toggle / reset / show subcommands for live reconfiguration; reset reverts everything.
          - uninstall.sh fully reverts TX power, WCNSS overrides, regdb mount and the country override.
          - Magisk description now shows driver country, framework country, requested profile, live TX power and consistency.
          - Legacy v1.4 REQUEST_* keys are mapped onto the v1.5 controls so old configs keep working.

          ### Validation
          Validated on Xiaomi pudding / Android 16 / Qualcomm qca_cld3_peach_v2.

          ### Scope
          For learning, research, interoperability, and controlled-laboratory reference only.
          The module gives full control of the parameters listed above; users are responsible for staying within local DFS/AFC/channel/power regulations.

          The attached ZIP is the Magisk-installable v1.5.0 package. SHA-256 is included in SHA256SUMS.txt.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo "Release v1.5.0 already exists; keeping published artifact unchanged."
            exit 0
          fi
          gh release create v1.5.0             WiFi7-Lab-Safe-v1.5.0.zip             SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "WiFi7-Lab v1.5.0"             --notes-file RELEASE_NOTES.md
