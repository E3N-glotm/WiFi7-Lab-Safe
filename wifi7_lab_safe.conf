# WiFi7-Lab v1.5.0
# Full-capability lab module: every control below is a real, reversible
# action. Nothing here is locked to a single value - edit this file (or use
# profile.sh) and run action.sh.
#
# --- Country / regulatory domain ---
# COUNTRY_PROFILE:
#   SYSTEM -> clear Android override and follow telephony/system policy
#   US/CA/CN/JP -> request that ISO country through Android Wi-Fi framework
#   00       -> request world/regulatory-agnostic domain (00)
#   CUSTOM   -> use COUNTRY_CODE (two ASCII letters, or 00)
# Note: which 6 GHz / 320 MHz / DFS channels exist is decided by the
# regulatory database for the selected country. To open every band,
# combine a country with the widest 6 GHz plan (commonly US/CA) and, if
# needed, a custom regdb.bin (see REGDB_MOUNT).
COUNTRY_PROFILE=US
COUNTRY_CODE=CN

# --- Capability keepers (EHT / MLO / 6 GHz vendor flags) ---
KEEP_EHT=1
KEEP_MLO=1
CHECK_6GHZ_VENDOR_CAPABILITY=1

# Verify both Android Framework and self-managed Qualcomm phy#0.
VERIFY_DRIVER_COUNTRY=1
COUNTRY_APPLY_RETRIES=12
COUNTRY_RETRY_DELAY_SEC=2

# --- TX power (v1.5) ---
# TX_POWER_MODE: auto = leave power to the regulatory domain/driver
#                fixed = force a fixed nl80211 TX power
# TX_POWER_MBM:  fixed power in millibel. 100 = 1 dB, so 24000 = 24 dBm,
#                27000 = 27 dBm. Values above the regulatory domain maximum
#                may be clamped or rejected by the driver - always check the
#                readback in the diagnostics export before assuming effect.
TX_POWER_MODE=auto
TX_POWER_MBM=24000

# --- WCNSS_qcom_cfg.ini user override (v1.5) ---
# When WCNSS_INJECT=1, any .ini file placed in $MODDIR/wcnss/ is merged on
# top of the vendor config into /data/vendor/wifi/ (the path the qcacld
# driver reads ahead of the read-only vendor file). Later entries win, so
# you can override individual keys (e.g. oem_6g_support_disable,
# mlo_support_link_num, TX chain/attenuation keys) without rebuilding the
# whole file. See wcnss/WCNSS_qcom_cfg.ini.example for known keys.
WCNSS_INJECT=1
# WCNSS_INJECT_DIR=$MODDIR/wcnss

# --- regdb.bin replacement (v1.5) ---
# When REGDB_MOUNT=1 and a file exists at $MODDIR/regdb.bin, it is
# bind-mounted over the detected vendor regdb.bin. This is the most direct
# way to change the regulatory channel/power table itself. Provide your own
# edited regdb.bin (e.g. via profile.sh regdb /path/to/regdb.bin). The
# original file on the vendor partition is never modified.
REGDB_MOUNT=1
# REGDB_REPLACE=$MODDIR/regdb.bin

# --- Driver reload without reboot (v1.5) ---
# WCNSS/regdb changes are picked up when the WLAN driver re-reads its
# config. Set FORCE_WIFI_TOGGLE=1 to have the module toggle Wi-Fi off/on
# after deployment (brief Wi-Fi drop only; cellular/ethernet unaffected,
# no reboot). Leave 0 and the changes take effect on next boot.
FORCE_WIFI_TOGGLE=0

# --- Diagnostics / logging ---
ENABLE_DIAGNOSTICS=1
VERBOSE_LOG=1
EXPORT_CHANNEL_TABLE=1
# Read-only Magisk status refresh (seconds). 0 disables the loop.
COUNTRY_STATUS_REFRESH_SEC=300

# --- Legacy v1.4 keys (retained for old configs) ---
# When set to 1 they now map onto real v1.5 controls:
#   REQUEST_UNRESTRICTED_REGDOMAIN=1  -> COUNTRY_PROFILE=00
#   REQUEST_FULL_TX_POWER=1           -> TX_POWER_MODE=fixed
REQUEST_UNRESTRICTED_REGDOMAIN=0
REQUEST_FULL_TX_POWER=0
REQUEST_DISABLE_DFS_AFC=0
