# WiFi 7 Capability Keeper v1.4.0
# This module keeps chipset capabilities available while leaving regulatory
# channel/power enforcement to the selected standard country domain.
#
# COUNTRY_PROFILE:
#   SYSTEM -> clear Android override and follow telephony/system policy
#   US/CA/CN/JP -> request that ISO country through Android Wi-Fi framework
#   CUSTOM -> use COUNTRY_CODE (two ASCII letters)
COUNTRY_PROFILE=SYSTEM
COUNTRY_CODE=CN

# Capability keepers. These do not patch Qualcomm regdb or WCNSS firmware.
KEEP_EHT=1
KEEP_MLO=1
CHECK_6GHZ_VENDOR_CAPABILITY=1

# Verify both Android Framework and self-managed Qualcomm phy#0.
VERIFY_DRIVER_COUNTRY=1
COUNTRY_APPLY_RETRIES=12
COUNTRY_RETRY_DELAY_SEC=2

# Diagnostics / logging.
ENABLE_DIAGNOSTICS=1
VERBOSE_LOG=1
EXPORT_CHANNEL_TABLE=1

# Legacy keys retained only so old configs remain readable.
# v1.4.0 intentionally does not implement these regulatory bypasses.
REQUEST_UNRESTRICTED_REGDOMAIN=0
REQUEST_FULL_TX_POWER=0
REQUEST_DISABLE_DFS_AFC=0
